name: Release

# dev 브랜치 push 시 누적된 .changeset/*.md 를 모아 release PR(version bump +
# CHANGELOG entry)을 자동 생성/갱신한다. release PR 이 dev 로 머지되면 install
# smoke 통과 후 changesets/action 이 npm publish 를 자동 실행하고, 직후 main
# 이 dev tip (= 방금 publish 된 commit) 으로 자동 FF 동기화된다 — main 은
# 사람이 직접 push/PR 하지 않는 자동 mirror.
#
# 정책 / 카테고리 / SCHEMA_VERSION 기준은 docs/release-policy.md.
#
# 인증: Trusted Publishing(OIDC) 단독 운영 — npm.com 의 3 패키지에 GitHub
# Actions provider(LLagoon3/token-weather + release.yml) 가 등록되어 있어,
# id-token: write OIDC 권한만으로 npm publish 가 인증된다. NPM_TOKEN /
# NODE_AUTH_TOKEN 의존성은 모두 제거했다 (long-lived secret 관리 부담 해소).

on:
  push:
    branches: [dev]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance (OIDC) + Trusted Publishing 인증
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 — 번들 npm 이 11+ 라 npm Trusted Publishing(OIDC) 요구사항을
      # 자기 업그레이드 없이 충족한다. node 22 번들 npm 위에서 npm 자기 업그레이드
      # step 자체가 native module 캐시 충돌(promise-retry 누락)로 깨졌던 회귀
      # (release run 25079605613)를 회피.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@token-weather'

      - run: node --version && npm --version

      - run: npm install --no-package-lock

      # publish 직전 안전벨트 — #75 에서 도입한 install smoke 스크립트 재사용.
      # release PR 머지 직후 changesets/action 이 publish 를 호출하기 전에
      # 한 번 더 npm pack → tmp install → bin smoke + d.ts/import 검증.
      # smoke fail 시 set -e 로 publish 차단.
      - run: bash ./scripts/install-smoke.sh

      - uses: changesets/action@v1
        id: changesets
        with:
          version: npx changeset version
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets 가 호출하는 npm publish 가 --provenance 플래그를 자동
          # 적용하도록 한다 (npm 9.5+ 인식). id-token: write OIDC 권한 +
          # Trusted Publisher 등록과 함께 supply chain attestation 보장.
          NPM_CONFIG_PROVENANCE: 'true'

      # publish 성공 직후 main 을 dev tip 으로 자동 FF.
      # GITHUB_SHA = release PR 의 dev 머지 commit = 방금 npm 으로 publish 된
      # tarball 의 source commit. 같은 commit 을 main 의 새 tip 으로 push 하면
      # main 이 npm latest 와 항상 정합되는 자동 mirror 로 유지된다.
      #
      # gate: changesets/action 이 publish mode 로 동작한 run 에서만 실행 —
      # version mode (release PR 갱신만) 에서는 published=false 라 step skip.
      # 이 덕분에 일반 feature PR 머지로는 main 이 안 움직인다.
      #
      # 본 step 이 사라지면 main 이 다시 정체되어 docs/*-merge-followup 같은
      # 수동 정합 PR 패턴이 부활한다 — repo-policy-release.test.js 가 가드.
      - name: FF sync main = dev tip (post-publish)
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -e
          git push origin HEAD:main
